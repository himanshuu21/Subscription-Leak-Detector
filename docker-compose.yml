services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sld_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-subscriptions_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sld_user} -d ${POSTGRES_DB:-subscriptions_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy   # Wait for Postgres to be ready before starting
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sld_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-subscriptions_db}
      SECRET_KEY: ${SECRET_KEY:?Set a 32+ character SECRET_KEY in .env}
      ENVIRONMENT: production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_HOURS: 24
      CURRENCY_SYMBOL: "Rs"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
